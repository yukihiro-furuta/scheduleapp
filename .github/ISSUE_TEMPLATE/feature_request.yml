name: 機能追加
description: 新しい機能の提案・追加リクエスト
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        機能追加の Issue を作成します。完了条件を明確に記入してください。

  - type: dropdown
    id: phase
    attributes:
      label: 対象フェーズ・レイヤー
      options:
        - "バックエンド（Spring Boot）"
        - "フロントエンド（React）"
        - "インフラ・環境（Docker / DB）"
        - "ドキュメント"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 機能の概要
      description: 追加したい機能を具体的に説明してください
      placeholder: 例：スケジュールの繰り返し設定（毎週・毎月）ができるAPIエンドポイントを追加する
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 背景・目的
      description: なぜこの機能が必要か、どんな問題を解決するかを説明してください
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件（Done の定義）
      description: この機能が完成したと言える基準をチェックリスト形式で記述してください
      placeholder: |
        - [ ] APIエンドポイントが正しいレスポンスを返す
        - [ ] DBに正しく保存される
        - [ ] 既存機能への影響がないことを確認
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 備考・参考リンク
      description: 関連 Issue、参考資料、設計メモなど（任意）
